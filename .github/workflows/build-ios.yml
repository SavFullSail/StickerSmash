name: Build Unsigned iOS IPA (iOS 27 Beta)
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🗂️ Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: 🗂️ Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: ⚙️ Prebuild Native iOS Project
        run: |
          rm -rf ios
          bunx expo prebuild --platform ios --clean

      - name: 🔨 Compile Unsigned ARM64 Device Binary (iOS 27 SDK)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/StickerSmash.xcworkspace \
            -scheme StickerSmash \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SWIFT_COMPILATION_MODE=singlefile \
            | xcbeautify --renderer github-actions

      - name: ✅ Verify Build Output
        run: |
          APP_PATH=$(ls -d build/Build/Products/Release-iphoneos/*.app 2>/dev/null | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found"
            exit 1
          fi
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "::error::Info.plist missing from $APP_PATH — build likely failed silently"
            ls -la "$APP_PATH"
            exit 1
          fi
          EXEC_NAME=$(basename "$APP_PATH" .app)
          if [ ! -f "$APP_PATH/$EXEC_NAME" ]; then
            echo "::error::Executable $EXEC_NAME missing from $APP_PATH"
            ls -la "$APP_PATH"
            exit 1
          fi
          echo "✅ App bundle verified: $APP_PATH"

      - name: 📦 Fast-Pack Sideloadable IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -rq -1 StickerSmash.ipa Payload
          rm -rf Payload

      - name: ⬆️ Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickerSmash-Device-IPA-iOS27
          path: StickerSmash.ipa
          retention-days: 2