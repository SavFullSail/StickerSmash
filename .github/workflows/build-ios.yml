name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Select Xcode 16.2 & Boot Simulator Runtime
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          # Boot a default simulator to initialize ibtoold / CoreSimulator daemon
          xcrun simctl boot "iPhone 16" || true

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Dependencies
        run: npm install

      - name: ⚙️ Prebuild Native iOS Project
        run: |
          rm -rf ios
          npx expo prebuild --platform ios --clean

      - name: 🔨 Compile Unsigned ARM64 Device Binary
        run: |
          xcodebuild build \
            -workspace ios/StickerSmash.xcworkspace \
            -scheme StickerSmash \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SWIFT_COMPILATION_MODE=singlefile

      - name: 📦 Fast-Pack Sideloadable IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -rq -1 StickerSmash.ipa Payload
          rm -rf Payload

      - name: ⬆️ Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickerSmash-Device-IPA
          path: StickerSmash.ipa
          retention-days: 2