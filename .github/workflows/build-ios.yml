name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # Allows manual trigger from the GitHub web UI

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: ⚙️ Generate Native iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: 🛠️ Install CocoaPods
        run: |
          cd ios
          pod install

      - name: 🔨 Compile Unsigned ARM64 Device Binary
        run: |
          xcodebuild \
            -workspace ios/StickerSmash.xcworkspace \
            -scheme StickerSmash \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 📦 Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          # Copy the compiled .app bundle into the Payload folder
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          # Zip into .ipa structure
          zip -r StickerSmash.ipa Payload
          rm -rf Payload

      - name: ⬆️ Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickerSmash-Device-IPA
          path: StickerSmash.ipa
          retention-days: 7