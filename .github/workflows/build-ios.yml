name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: ⚙️ Generate Native iOS Project & Install Pods
        run: npx expo prebuild --platform ios --clean

      - name: 🔨 Compile Unsigned ARM64 Device Binary
        run: |
          xcodebuild \
            -workspace ios/StickerSmash.xcworkspace \
            -scheme StickerSmash \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 📦 Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r StickerSmash.ipa Payload
          rm -rf Payload

      - name: ⬆️ Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickerSmash-Device-IPA
          path: StickerSmash.ipa
          retention-days: 7